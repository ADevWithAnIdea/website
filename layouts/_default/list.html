{{ define "main" }}
<section class="section">
  <div class="container container-narrow">
    <h1>{{ .Title }}</h1>
    {{ .Content }}
    {{ if .Pages }}
    <div class="post-list">
      {{ range .Pages }}
      <a href="{{ .RelPermalink }}" class="post-item">
        {{ with .Date }}<time>{{ .Format "January 2, 2006" }}</time>{{ end }}
        <h3>{{ .Title }}</h3>
        {{ with .Params.summary }}<p>{{ . }}</p>{{ end }}
      </a>
      {{ end }}
    </div>
    {{ end }}
  </div>
</section>
{{ end }}
