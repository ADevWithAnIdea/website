baseURL = "https://codyho.dev"
languageCode = "en-us"
title = "Cody Ho"

# RSS is served only for /blog/ (the sole section). No feed for the home
# page, taxonomies, or terms.
[outputs]
  home = ["HTML"]
  section = ["HTML", "RSS"]
  taxonomy = ["HTML"]
  term = ["HTML"]

[params]
  description = "Personal website of Cody Ho"
  author = "Cody Ho"
  github = "https://github.com/ADevWithAnIdea"
  linkedin = "https://linkedin.com"

[menus]
  [[menus.main]]
    name = "Blog"
    url = "/blog/"
    weight = 1
  [[menus.main]]
    name = "About"
    url = "/about/"
    weight = 3
  [[menus.main]]
    name = "Contact"
    url = "/contact/"
    weight = 4
  [[menus.main]]
    name = "Resume"
    url = "/documents/cody_ho_resume.pdf"
    weight = 5
  [[menus.main]]
    name = "GitHub"
    url = "https://github.com/ADevWithAnIdea"
    weight = 6
    [menus.main.params]
      external = true

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
